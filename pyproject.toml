[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyserve"
version = "0.1.0"
description = "A tiny LLM inference engine built from scratch: continuous batching, a paged KV cache, request scheduling and token streaming."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Usman Siddiqi" }]
requires-python = ">=3.11"
keywords = ["llm", "inference", "serving", "continuous-batching", "paged-attention", "kv-cache"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
# Install the CPU build of PyTorch first (see README), then `pip install -e .`.
dependencies = [
    "torch==2.9.1",
    "fastapi==0.163.2",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.5",
]
bench = [
    "numpy==2.5.5",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
]

[project.scripts]
tinyserve-server = "tinyserve.server:main"
tinyserve-loadgen = "tinyserve.loadgen:main"

[tool.setuptools.packages.find]
include = ["tinyserve*"]

[tool.setuptools.package-data]
tinyserve = ["assets/*.pt"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
